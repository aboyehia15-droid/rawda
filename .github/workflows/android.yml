name: بناء تطبيق أندرويد

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android
            .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk rawda.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rawda-apk
          path: rawda.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: تطبيق روضة الدروس ${{ github.run_number }}
          body: "ثبّت ملف rawda.apk على شاشة أندرويد. يفتح البرنامج المحدَّث مباشرة."
          files: rawda.apk
          make_latest: true
