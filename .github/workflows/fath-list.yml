name: fath-list
on: workflow_dispatch
permissions: {contents: write}
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - run: |
          mkdir -p fath
          for t in videos shorts streams playlists; do
            yt-dlp --flat-playlist -J "https://www.youtube.com/@alnooraniah8116/$t" 2> fath/err_$t.txt > fath/raw_$t.json || echo "{}" > fath/raw_$t.json
          done
          python3 - <<'P'
          import json
          out={}
          for t in ["videos","shorts","streams","playlists"]:
              try:d=json.load(open(f"fath/raw_{t}.json"))
              except Exception:continue
              out[t]=[{"id":e.get("id"),"t":e.get("title"),"d":e.get("duration"),"u":e.get("url")} for e in (d.get("entries") or [])]
          # playlists contents
          pls=[]
          for p in out.get("playlists",[]):
              import subprocess
              r=subprocess.run(["yt-dlp","--flat-playlist","-J","https://www.youtube.com/playlist?list="+p["id"]],capture_output=True,text=True)
              try:j=json.loads(r.stdout);pls.append({"id":p["id"],"t":p["t"],"v":[e.get("id") for e in j.get("entries") or []]})
              except Exception:pass
          out["pl"]=pls
          json.dump(out,open("fath/list.json","w"),ensure_ascii=False,indent=0)
          P
          rm -f fath/raw_*.json
      - run: |
          git config user.name bot; git config user.email bot@x
          git add fath/list.json fath/err_*.txt; git commit -m "fath list"; git push
