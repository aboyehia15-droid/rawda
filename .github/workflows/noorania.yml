name: تحليل صوت القاعدة النورانية
on:
  push:
    paths: [tools/noorania.txt]
  workflow_dispatch:
concurrency: {group: noorania, cancel-in-progress: true}
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: download and analyse
        timeout-minutes: 40
        run: |
          mkdir -p /tmp/nr noorania
          : > noorania/download-log.txt
          for i in $(seq 1 17); do
            for u in https://ia801909.us.archive.org/16/items/alnawrania1-17 https://ia601909.us.archive.org/16/items/alnawrania1-17 https://archive.org/download/alnawrania1-17; do
              code=$(curl -sSL --http1.1 --connect-timeout 20 --max-time 240 -A "Mozilla/5.0" -o /tmp/nr/n$i.mp3 -w '%{http_code} %{size_download} %{time_total} %{url_effective}' $u/n$i.mp3 2>&1 || true)
              echo "n$i $code" >> noorania/download-log.txt
              [ -s /tmp/nr/n$i.mp3 ] && [ $(stat -c%s /tmp/nr/n$i.mp3) -gt 50000 ] && break || true
            done
          done
          python3 tools/noorania_sync.py /tmp/nr noorania/sync.json >> noorania/download-log.txt 2>&1 || true
          python3 tools/noorania_align.py tools/noorania_cells.json noorania/sync.json noorania/map.json >> noorania/download-log.txt 2>&1 || true
      - name: commit
        if: always()
        run: |
          git config user.name "rawda-bot"; git config user.email "actions@users.noreply.github.com"
          git add noorania/; git commit -m "Noorania audio timings" || exit 0
          git pull --rebase -q; git push
