name: fath-dl
on: workflow_dispatch
permissions: {contents: write}
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U yt-dlp
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release view fath-videos >/dev/null 2>&1 || gh release create fath-videos -t "القاعدة النورانية الفتحية المطورة" -n "فيديوهات القاعدة النورانية الفتحية المطورة"
          have=$(gh release view fath-videos --json assets -q '.assets[].name')
          mkdir -p v; ok=0; bad=0
          for id in $(python3 -c "import json;print(' '.join(e['id'] for e in json.load(open('fath/list.json'))['videos']))"); do
            n="f_${id}.mp4"; echo "$have" | grep -qx -- "$n" && { ok=$((ok+1)); continue; }
            if yt-dlp -q --no-warnings -f "18/best[ext=mp4][height<=480][acodec!=none]" -o "v/$n" -- "$id"; then gh release upload fath-videos "v/$n" --clobber && ok=$((ok+1)); rm -f "v/$n"; else bad=$((bad+1)); fi
          done
          echo "ok=$ok bad=$bad"
