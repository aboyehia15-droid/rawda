name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools}
      - run: |
          curl -sL --retry 3 -o n2.mp3 https://ia801909.us.archive.org/16/items/alnawrania1-17/n2.mp3
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          timeout 600 python tools/probe_time.py
