name: إنشاء الحزمة الصوتية العربية

on:
  push:
    branches: [main]
    paths: ['tools/voice-items.json', 'tools/make_voice_pack.py', '.github/workflows/voices.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            voices
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Piper and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts
      - name: Download the Arabic voice
        run: |
          mkdir -p model
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium
          curl -sSL -o model/ar.onnx "$base/ar_JO-kareem-medium.onnx"
          curl -sSL -o model/ar.onnx.json "$base/ar_JO-kareem-medium.onnx.json"
          ls -la model
      - name: Build the voice pack
        run: python tools/make_voice_pack.py model/ar.onnx
      - name: Commit the pack
        run: |
          git config user.name "aboyehia15-droid"
          git config user.email "aboyehia15-droid@users.noreply.github.com"
          python3 tools/make_index.py
          git add voices/*.json books/index.json 2>/dev/null || git add voices/*.json
          git diff --cached --quiet && exit 0
          git commit -m "الحزمة الصوتية العربية (تُستورد تلقائيًا على كل الشاشات)"
          git pull --rebase -q origin main
          git push
