:root {
  /* الألوان الستة المسماة */
  --night: #1F2A5A;   /* ليلي */
  --dawn: #CFEBFF;    /* فجر */
  --meadow: #19B394;  /* مرج */
  --rose: #F2658E;    /* ورد */
  --sun: #FFD34E;     /* شمس */
  --cloud: #FAFCFF;   /* غيم */
  /* ظلال مشتقة (الظل دائماً بلون أغمق من العنصر نفسه، لا رمادي) */
  --night-soft: #3A4789;
  --meadow-deep: #0B8269;
  --rose-deep: #C23C69;
  --sun-deep: #E2A21B;
  --violet: #8E5CF0;
  --sky: #8FD3F4;
  --lilac-deep: #9FB3E0;

  --font: 'Tajawal', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', sans-serif;
  --tap: 72px; /* أصغر مساحة لمس: ٧٢ على الجوال */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
@media (min-width: 700px) and (min-height: 700px) {
  :root { --tap: 96px; } /* ٩٦ على الآيباد */
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--dawn);
  color: var(--night);
  font-family: var(--font);
  font-weight: 700;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}

#app { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow: hidden; }

button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus { outline: none; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
svg { display: block; }
h1, h2, h3 { margin: 0; }

textarea, input { -webkit-user-select: text; user-select: text; }

/* تنفّس الشخصيات وهي ساكنة */
.breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }

.scrollable { touch-action: pan-y; }

@media (prefers-reduced-motion: reduce) {
  .breathe, .home-cloud, .home-sun, .bracket::after, .balloon, .home-balloon, .bird, .home-bird, .wing-l, .wing-r, .sails, .end-star, .firefly, .end-moon, .sleepy-z, .end-z { animation: none !important; }
}

</style>
<style>
/* مكوّنات الواجهة المشتركة: الأزرار، المصابيح، الشاشة الرئيسية، ركن الوالدين، الشاشة الختامية */

/* ───────── أزرار الزوايا الثابتة (الرئيسية / إعادة العرض) ───────── */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 30;
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
  padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
  pointer-events: none; transition: opacity .6s;
}
.hud > * { pointer-events: auto; }
.hud.is-hidden { opacity: 0; pointer-events: none; }
.hud.is-hidden > * { pointer-events: none; }

.hud-btn {
  width: var(--tap); height: var(--tap); border-radius: 50%;
  display: grid; place-items: center; color: var(--night); flex: none;
  background: radial-gradient(circle at 35% 26%, #fff 0%, #F1F6FF 55%, #D9E5FB 100%);
  box-shadow: 0 6px 0 var(--lilac-deep), 0 12px 18px rgba(31, 42, 90, .2);
  transition: transform .1s, box-shadow .1s;
  position: relative;
}
.hud-btn svg { width: 54%; height: 54%; }
.hud-btn.pressed, .hud-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--lilac-deep), 0 3px 8px rgba(31, 42, 90, .2); }
.hud-btn:disabled { opacity: .35; pointer-events: none; }
@media (max-width: 560px) { .hud .pause-btn { order: 2; } }
/* الإيقاف المؤقت: يتجمّد المسرح وتظهر طبقة بزر متابعة كبير */
.is-paused .stage, .is-paused .stage * { animation-play-state: paused !important; }
.pause-layer { position: absolute; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(31, 42, 90, .45); }
.resume-btn { width: calc(var(--tap) * 1.9); height: calc(var(--tap) * 1.9);
  background: radial-gradient(circle at 35% 26%, #FFF4B8 0%, var(--sun) 60%, #F5BC2A 100%); box-shadow: 0 10px 0 var(--sun-deep), 0 20px 30px rgba(0, 0, 0, .3); }
.resume-btn svg { width: 46%; height: 46%; margin-inline-start: 6%; }
.resume-btn.pressed, .resume-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--sun-deep), 0 6px 12px rgba(0, 0, 0, .3); }

/* ───────── مصابيح الجلسة ───────── */
.bulbs {
  --b: min(30px, calc((100vw - 2 * var(--tap) - 48px) / (var(--n, 10) * 1.3)));
  position: relative; flex: 1 1 0; min-width: 0;
  display: flex; justify-content: center; align-items: flex-start; gap: calc(var(--b) * .3);
  padding-top: 6px;
}
.bulbs .wire {
  position: absolute; left: 12%; right: 12%; top: 9px; height: 3px; border-radius: 3px;
  background: var(--night-soft); opacity: .55;
}
.bulb { position: relative; width: var(--b); height: calc(var(--b) * 1.38); transform-origin: 50% 0; }
.bulb svg { width: 100%; height: 100%; overflow: visible; }
.bulb .glass { fill: #B9C6EE; stroke: #8FA0D8; stroke-width: 1; transition: fill .4s; }
.bulb .shine { fill: #fff; opacity: .55; }
.bulb .glow { fill: var(--sun); opacity: 0; transition: opacity .5s; }
.bulb.lit .glass { fill: var(--sun); stroke: var(--sun-deep); }
.bulb.lit .glow { opacity: .55; }
@media (max-width: 560px) {
  /* على الجوال العمودي: المصابيح في صف مستقل تحت الأزرار */
  .bulbs { order: 3; flex-basis: 100%; margin-top: 4px; --b: min(30px, calc((100vw - 40px) / (var(--n, 10) * 1.3))); }
  .bulbs .wire { top: 9px; }
}

/* ───────── ستارة الانتقال والجسيمات ───────── */
.curtain { position: fixed; inset: 0; z-index: 200; overflow: hidden; }
.curtain-disc { position: absolute; border-radius: 50%; will-change: transform; }
.confetti { position: absolute; pointer-events: none; will-change: transform, opacity; z-index: 25; }

/* ───────── الشاشة الختامية الهادئة ───────── */
.end-screen {
  position: absolute; inset: 0; z-index: 40; overflow: hidden;
  background: linear-gradient(180deg, #232C6B 0%, #4A3FA6 58%, #B35FA8 100%);
  display: flex; align-items: center; justify-content: center;
}
.end-art { width: 100%; display: grid; place-items: center; padding-bottom: calc(var(--tap) * 1.6); }
.end-home {
  position: absolute; bottom: calc(26px + var(--safe-b)); left: 0; right: 0; margin: 0 auto;
  width: calc(var(--tap) * 1.3); height: calc(var(--tap) * 1.3);
  background: radial-gradient(circle at 35% 26%, #FFF4B8 0%, var(--sun) 60%, #F5BC2A 100%);
  box-shadow: 0 8px 0 var(--sun-deep), 0 16px 24px rgba(0, 0, 0, .3);
}
.end-home.pressed, .end-home:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--sun-deep), 0 4px 10px rgba(0, 0, 0, .3); }

/* ───────── الشاشة الرئيسية ───────── */
.home { background: linear-gradient(180deg, #8FD3F4 0%, #CFEBFF 50%, #EAF7FF 100%); }
.home-sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.home-sun { position: absolute; left: 3%; top: 2%; width: clamp(90px, 16vmin, 150px); animation: sunBreath 7s ease-in-out infinite; }
@keyframes sunBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.home-cloud { position: absolute; left: 0; width: clamp(110px, 20vmin, 190px); animation: drift 70s linear infinite; }

.end-plant { position: absolute; bottom: calc(var(--tap) * 1.5 + 60px); left: 0; right: 0; margin: 0 auto; width: clamp(70px, 14vmin, 110px); pointer-events: none; z-index: 2; }

/* ═════════ الرئيسية: ١٠ في «وحدي» + ٢ + ٤ ═════════ */

}

}

  background: linear-gradient(135deg, #B79BFF, #8E5CF0); box-shadow: 0 7px 0 #6B3CC9, 0 14px 20px rgba(107, 60, 201, .25); }

/* مجموعات «وحدي» */

.group-label { display: inline-block; padding: 1px 12px; margin: 2px 0 4px; border-radius: 999px; background: rgba(255, 255, 255, .28); color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 0 var(--zd); }

@media (orientation: landscape) { .group .tile { flex: 0 0 calc((100% - 40px) / 5); } .group-label { margin: 0; font-size: 12px; } .groups { gap: 2px; } }

html.night::after { content: ''; position: fixed; inset: 0; z-index: 900; pointer-events: none; background: rgba(22, 30, 90, .52); mix-blend-mode: multiply; }

.dr-tool .tool-svg { width: 62%; height: auto; } .dr-tool small { font-size: 12px; font-weight: 800; color: var(--night-soft); line-height: 1; }

.dr-tool.selected { box-shadow: 0 0 0 5px var(--sun), 0 6px 0 var(--sun-deep); }

.dr-mixdot.on { display: block; }

/* ═════════ الألعاب الخمس الجديدة ═════════ */
.fd-stage { background: linear-gradient(180deg, #FFF3C9 0%, #D9F7D6 100%); --deep: #0B8269; }
.fd-animal { width: clamp(130px, min(40vmin, 28vh), 240px); } .fd-animal svg { width: 100%; height: auto; }
.fd-fly { position: absolute; z-index: 40; width: 72px; pointer-events: none; } .fd-fly svg { width: 100%; height: auto; }

.hd-stage .g-main { display: flex; }

.hd-btn { background: transparent !important; box-shadow: none !important; padding: 0 !important; overflow: visible; }
.hd-wrap { position: relative; display: block; width: 100%; height: 100%; } .hd-spot { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
.hd-animal { position: absolute; left: 15%; width: 70%; z-index: 1; } .hd-animal svg { width: 100%; height: auto; }

.vn-item { width: clamp(80px, min(28vw, 19vh), 170px); aspect-ratio: 1; border-radius: 24%; background: #FAFCFF; padding: 8%; box-shadow: 0 5px 0 #9FB3E0; } .vn-item svg { width: 100%; height: 100%; }
.vn-item.gone { background: rgba(255, 255, 255, .35); box-shadow: inset 0 0 0 4px #8E5CF0; border: 0; } .vn-item.gone svg { opacity: 0; }
.od2-stage { background: linear-gradient(180deg, #FFE9C7 0%, #E3F6FF 100%); --deep: #C23C69; }

.or-podium { display: flex; flex-direction: row-reverse; align-items: flex-end; gap: 8px; min-height: 40px; }
.or-slot { width: calc(var(--tap) * var(--s) * 1.3 + 10px); min-height: calc(var(--tap) * var(--s) * 1.3 + 10px); border-radius: 18px; border: 4px dashed #C9B8FF; display: grid; place-items: center; background: rgba(255, 255, 255, .5); }

.or-item svg { width: 100%; height: 100%; } .or-item.placed { box-shadow: 0 0 0 4px var(--sun); width: 100%; height: 100%; min-width: 0; min-height: 0; padding: 4px; } .or-item:disabled { opacity: 1; }
.hb-stage { background: linear-gradient(180deg, #E2F7FF 0%, #FFF0C9 100%); --deep: #2468D1; }
.hb-btn { padding: 4% !important; --cs: clamp(var(--tap), min(30vw, 20vh), 190px); } .hb-scene { width: 100%; height: 100%; border-radius: 16px; }
@media (orientation: landscape) and (max-height: 640px) { .fd-stage, .hb-stage, .hd-stage { flex-direction: row; gap: 14px; } .mg-tray.hd-grid { grid-template-columns: repeat(3, var(--cs)); --cs: clamp(var(--tap), 24vh, 110px); } }
/* أدوات الرسم: صفّان واضحان بلا تمرير جانبي */
.dr-tray { flex-wrap: wrap !important; justify-content: center !important; overflow: visible !important; gap: 4px !important; direction: ltr !important; padding-top: 8px; }
.dr-sep { display: none; }
@media (orientation: landscape) and (max-height: 640px) { .dr-tray { flex-direction: column !important; flex-wrap: wrap !important; max-height: 100%; width: auto; } }
.or-slot { width: calc(var(--sz) * .7); min-height: calc(var(--sz) * .7); height: calc(var(--sz) * .7); }
.or-item { width: var(--sz); height: var(--sz); min-width: 0; min-height: 0; }
.or-item.placed { width: 100%; height: 100%; }
.gd-banner { overflow: hidden; } .gb-prev { overflow: hidden; flex-wrap: nowrap; } .gb-item { width: 30px; }
.or-slot { width: calc(var(--sz) * .6); min-height: calc(var(--sz) * .6); height: calc(var(--sz) * .6); } .or-podium { gap: 5px; flex-wrap: nowrap; max-width: 100%; }

/* ═════════ ماذا ينقص الصورة؟ ═════════ */

.ms-fly { position: absolute; z-index: 40; width: 80px; pointer-events: none; transform-origin: 0 0; } .ms-fly svg { width: 100%; height: auto; }

.wt-tool { position: absolute; width: 26%; aspect-ratio: 1; min-width: var(--tap); min-height: var(--tap); background: none; padding: 0; display: grid; place-items: center; }
.wt-tool svg { width: 100%; height: auto; overflow: visible; }
.wt-seed { left: 8%; bottom: 8%; width: 18%; } .wt-can { right: 4%; top: 20%; width: 34%; } .wt-sun { left: 2%; top: 2%; width: 26%; }
.wt-next { animation: pulseHint 1s ease-in-out infinite; filter: drop-shadow(0 0 12px rgba(255, 211, 78, .95)); }

.wt-bf { position: absolute; left: 30%; top: 30%; width: 22%; pointer-events: none; } .wt-bf svg { width: 100%; height: auto; }
/* ═════════ ساعد الأرنب ═════════ */
.mz-stage { background: linear-gradient(180deg, #D8F3FF 0%, #CFF0C0 100%); --deep: #1C8F5C; }
.mz-board { position: relative; width: min(92vw, 58vh, 470px); aspect-ratio: 1; display: grid; grid-template-columns: repeat(var(--n), 1fr); direction: ltr; border-radius: 16px; overflow: hidden; background: #BFEAA8; touch-action: none; box-shadow: 0 8px 0 #1C8F5C, 0 18px 24px rgba(28, 143, 92, .25); }
.mz-cell { background: #D9F5C6; box-sizing: border-box; } .mz-cell.alt { background: #CBEFB5; }

.mz-item svg, .mz-rabbit svg { width: 78%; height: 78%; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .15)); } .mz-goal { transition: none; } .mz-rabbit { z-index: 3; }
@media (orientation: landscape) and (max-height: 640px) { .mz-board { width: min(76vh, 60vw); } }
/* ═════════ إبداعاتي + علامة الحفظ ═════════ */
.saved-mark { position: absolute; z-index: 80; left: 50%; top: 40%; width: 120px; margin: -60px 0 0 -60px; pointer-events: none; } .saved-mark svg { width: 100%; height: auto; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .25)); }

.gl-card { aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 6px 0 #B9A6F0, 0 10px 16px rgba(107, 60, 201, .2); cursor: pointer; }

.gl-big { position: absolute; inset: 0; z-index: 60; background: rgba(31, 42, 90, .75); display: grid; place-items: center; padding: 20px; }
.gl-big img { max-width: 100%; max-height: 100%; border-radius: 24px; background: #fff; box-shadow: 0 12px 0 #8E5CF0; }
.dr-tool.dr-save, .cl-save { --deep: #6B3CC9; }
/* ═════════ شريط الإكمال/التحدي + الأرنب المرشد + «فاجئني بلعبة» ═════════ */
.chips-row { display: flex; gap: 10px; margin: 0 0 10px; flex-wrap: wrap; }
.home-chip { flex: 1 1 150px; display: flex; align-items: center; gap: 10px; min-height: var(--tap); padding: 6px 12px; border: 0; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 #B9A6F0, 0 8px 14px rgba(107, 60, 201, .18); font-family: inherit; cursor: pointer; text-align: start; }

<script>
/* التخزين: localStorage داخل try/catch، مع إصدار للمخطط ودوال ترحيل.
   إن لم يتوفر التخزين يعمل التطبيق من الذاكرة. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  var KEY = 'bustan.progress';
  var SCHEMA = 3;
  var GAME_IDS = ['train', 'mirror', 'pattern', 'fruits', 'letters', 'memory', 'shadows', 'more', 'odd', 'tracing', 'feed', 'hide', 'vanish', 'order', 'habitat', 'missing', 'water', 'maze', 'treasure', 'mimic', 'firstsound', 'bridge'];
  var MAX_DAYS = 60;

  var data = null;
  var persistent = false; // هل التخزين الفعلي متاح؟

  function newGame() {
    return { level: 1, smooth: 0, rough: 0, sessions: 0, rounds: 0, last: '' };
  }

  function defaults() {
    var games = {};
    GAME_IDS.forEach(function (id) { games[id] = newGame(); });
    return {
      schemaVersion: SCHEMA,
      created: Date.now(),
      settings: { soundOn: true, timerMin: 0, pin: '', soloLimit: 2, soloLimitOn: false, weeklyConnector: 0, night: false },
      games: games,
      days: {},          // 'YYYY-MM-DD' -> { sessions:{id:n}, rounds:{id:n} }
      lock: { soloOpenDate: '' }, // تاريخ اليوم الذي فتح فيه الوالد «وحدي» رغم الحد
      demoSeen: {},      // id -> true
      garden: [],        // أنواع ما زُرع في «بستاني»
      gallery: [],       // صور «إبداعاتي» (روابط data)
      timer: { date: '', usedMs: 0, extraMs: 0, locked: false },   // مؤقّت وقت اللعب
      stories: {},       // id -> { read:true } القصص التي أُكملت
      last: '',          // آخر لعبة لُعبت (لبطاقة «أكمل»)
      welcomed: false    // هل عُرضت شاشة الترحيب
    };
  }

  /* جدول الترحيل: المفتاح هو الإصدار القديم، والدالة تُرقّي بمقدار واحد.
     عند رفع SCHEMA أضف دالة هنا ولا تغيّر القديمة. */
  var MIGRATIONS = {
    0: function (d) { d.schemaVersion = 1; return d; },
    // ١ → ٢: كان الصوت مطفأً افتراضياً، وصار مفعّلاً؛ نفعّله لمن حُفظ عنده الافتراضي القديم
    1: function (d) { if (d.settings) d.settings.soundOn = true; d.schemaVersion = 2; return d; },
    // ٢ → ٣: البستان وشاشة الترحيب
    2: function (d) { d.garden = d.garden || []; d.schemaVersion = 3; return d; }
  };

  function isObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }

  // دمج عميق للقيم الناقصة من الافتراضات
  function fill(target, def) {
    Object.keys(def).forEach(function (k) {
      if (isObj(def[k])) {
        if (!isObj(target[k])) target[k] = {};
        fill(target[k], def[k]);
      } else if (target[k] === undefined || typeof target[k] !== typeof def[k]) {
        target[k] = def[k];
      }
    });
    return target;
  }

  function migrate(d) {
    if (!isObj(d)) return defaults();
    var v = typeof d.schemaVersion === 'number' ? d.schemaVersion : 0;
    while (v < SCHEMA) {
      var fn = MIGRATIONS[v];
      if (!fn) break;
      d = fn(d);
      v = d.schemaVersion;
    }
    d.schemaVersion = SCHEMA;
    fill(d, defaults());
    // قيود سلامة
    GAME_IDS.forEach(function (id) {
      var g = d.games[id];
      g.level = Math.max(1, Math.min(5, g.level | 0));
    });
    d.settings.soloLimit = Math.max(1, Math.min(9, d.settings.soloLimit | 0));
    return d;
  }

  function probe() {
    try {
      var k = KEY + '.probe';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  function load() {
    persistent = probe();
    var raw = null;
    if (persistent) {
      try { raw = window.localStorage.getItem(KEY); } catch (e) { raw = null; }
    }
    if (raw) {
      try { data = migrate(JSON.parse(raw)); } catch (e) { data = defaults(); }
    } else {
      data = defaults();
    }
  }

  function save() {
    if (!persistent) return false;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      persistent = false;
      return false;
    }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return dateKey(new Date()); }

  function day(key) {
    key = key || todayKey();
    if (!data.days[key]) data.days[key] = { sessions: {}, rounds: {} };
    return data.days[key];
  }

  function prune() {
    var keys = Object.keys(data.days).sort();
    while (keys.length > MAX_DAYS) delete data.days[keys.shift()];
  }

  function zoneOf(id) {
    var c = B.catalog || [];
    for (var i = 0; i < c.length; i++) if (c[i].id === id) return c[i].zone;
    return 'solo';
  }

  var S = {
    SCHEMA: SCHEMA,
    GAME_IDS: GAME_IDS,
    init: function () { load(); },
    data: function () { return data; },
    save: save,
    isPersistent: function () { return persistent; },
    todayKey: todayKey,
    dateKey: dateKey,
    migrate: migrate,
    defaults: defaults,

    game: function (id) { return data.games[id]; },

    recordRound: function (id) {
      var g = data.games[id];
      data.last = id;
      g.rounds++;
      g.last = todayKey();
      var d = day();
      d.rounds[id] = (d.rounds[id] || 0) + 1;
      prune();
      save();
    },

    recordSession: function (id) {
      data.games[id].sessions++;
      var d = day();
      d.sessions[id] = (d.sessions[id] || 0) + 1;
      save();
    },

    /* عدد جلسات منطقة «وحدي» المكتملة اليوم */
    soloSessionsToday: function () {
      var d = data.days[todayKey()];
      if (!d) return 0;
      var n = 0;
      Object.keys(d.sessions).forEach(function (id) {
        if (zoneOf(id) === 'solo') n += d.sessions[id];
      });
      return n;
    },

    /* هل قسم «وحدي» مقفل اليوم؟ */
    soloLocked: function () {
      if (!data.settings.soloLimitOn) return false;   // الحد اليومي اختياري يفعّله الوالد
      if (data.lock.soloOpenDate === todayKey()) return false;
      return S.soloSessionsToday() >= data.settings.soloLimit;
    },

    openSoloToday: function () { data.lock.soloOpenDate = todayKey(); save(); },

    markDemoSeen: function (id) { data.demoSeen[id] = true; save(); },
    demoSeen: function (id) { return !!data.demoSeen[id]; },

    /* آخر ٧ أيام (الأقدم أولاً): [{key, date, sessions, rounds}] */
    lastDays: function (n) {
      n = n || 7;
      var out = [];
      var now = new Date();
      for (var i = n - 1; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        var k = dateKey(d);
        var rec = data.days[k];
        var s = 0, r = 0;
        if (rec) {
          Object.keys(rec.sessions).forEach(function (x) { s += rec.sessions[x]; });
          Object.keys(rec.rounds).forEach(function (x) { r += rec.rounds[x]; });
        }
        out.push({ key: k, date: d, sessions: s, rounds: r });
      }
      return out;
    },

    resetGame: function (id) {
      data.games[id] = newGame();
      delete data.demoSeen[id];
      save();
    },

    exportJSON: function () { return JSON.stringify(data); },

    /* استعادة: تُرجع true عند النجاح. لا تمسّ البيانات الحالية إن فشلت. */
    importJSON: function (text) {
      try {
        var parsed = JSON.parse(text);
        if (!isObj(parsed) || !isObj(parsed.games)) return false;
        if (typeof parsed.schemaVersion === 'number' && parsed.schemaVersion > SCHEMA) return false;
        data = migrate(parsed);
        save();
        return true;
      } catch (e) { return false; }
    }
  };

  B.storage = S;
})();

</script>
<script>
/* محرك التكيّف الصامت: ٥ مستويات لكل لعبة.
   يصعد بعد ٣ جولات سلسة متتالية (≤ خطأ واحد)،
   ويهبط بعد جولتين متتاليتين فيهما ٣ أخطاء فأكثر.
   جولة فيها خطآن لا تُعدّ سلسة ولا صعبة، فتقطع السلسلتين.
   لا يظهر للطفل أي أثر لهذا. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  var MAX = 5, UP_AFTER = 3, DOWN_AFTER = 2;

  /* دالة نقية: تأخذ الحالة {level, smooth, rough} وعدد أخطاء الجولة،
     وتُرجع حالة جديدة مع حقل change: 'up' | 'down' | null */
  function step(state, errors) {
    var level = state.level, smooth = state.smooth, rough = state.rough, change = null;
    if (errors <= 1) { smooth++; rough = 0; }
    else if (errors >= 3) { rough++; smooth = 0; }
    else { smooth = 0; rough = 0; }

    if (smooth >= UP_AFTER) {
      if (level < MAX) { level++; change = 'up'; }
      smooth = 0; rough = 0;
    } else if (rough >= DOWN_AFTER) {
      if (level > 1) { level--; change = 'down'; }
      smooth = 0; rough = 0;
    }
    return { level: level, smooth: smooth, rough: rough, change: change };
  }

  B.adaptive = {
    MAX: MAX,
    step: step,
    level: function (gameId) { return B.storage.game(gameId).level; },
    report: function (gameId, errors) {
      var g = B.storage.game(gameId);
      var r = step(g, errors);
      g.level = r.level; g.smooth = r.smooth; g.rough = r.rough;
      B.storage.save();
      return r;
    }
  };
})();

</script>
<script>
/* الصوت: مؤثرات ناعمة مولَّدة بـ WebAudio (لا ملفات صوت)، بلا موسيقى خلفية ولا نطق آلي.
   كل الأصوات قصيرة وهادئة، تمرّ عبر ضاغط يمنع أي ذروة عالية (الطفل حساسة للأصوات العالية).
   لا يوجد أي صوت «خطأ» أو «خسارة». مفتاح عام في ركن الوالدين.
   يُفعَّل السياق بعد أول لمسة (قيد iOS). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  var ctx = null, master = null, noiseBuf = null;

  function enabled() {
    return !!(B.storage && B.storage.data() && B.storage.data().settings.soundOn);
  }

  function ensure() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 4.2; // شدة واضحة مسموعة، والضاغط يمنع الذروات
      var comp = ctx.createDynamicsCompressor(); // يحدّ الذروات
      comp.threshold.value = -12; comp.ratio.value = 6;
      master.connect(comp); comp.connect(ctx.destination);
      // ضجيج أبيض قصير يُستعمل لأصوات القطار
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
    return ctx;
  }

  /* «سمة صوت» لكل لعبة: تغيّر الطبقة ولمعان الضجيج ونوع الموجة، فلا تتشابه أصوات الألعاب */
  var T0 = { p: 1, b: 1, w: null };
  var THEMES = [T0, { p: 0.8, b: 0.8, w: null }, { p: 1.25, b: 1.2, w: null }, { p: 1, b: 0.7, w: 'triangle' }, { p: 1.12, b: 1.4, w: 'triangle' }, { p: 0.9, b: 1.1, w: 'sine' }, { p: 1.4, b: 0.9, w: 'sine' }, { p: 0.72, b: 1.3, w: 'square' }, { p: 1.18, b: 0.6, w: null }, { p: 0.95, b: 1.6, w: 'triangle' }];
  var th = T0;
  var ORDER = ['train', 'mirror', 'pattern', 'firstsound', 'bridge', 'fruits', 'letters', 'memory', 'shadows', 'more', 'odd', 'tracing', 'feed', 'hide', 'vanish', 'order', 'habitat', 'missing', 'water', 'maze', 'workshop', 'coloring', 'drawing', 'garden', 'gallery'];

  // نغمة: تردد، بداية، مدة، شدة، نوع الموجة، تردد نهائي اختياري (انزلاق)
  function tone(c, f, at, dur, vol, type, f2) {
    var o = c.createOscillator(), g = c.createGain();
    f *= th.p; if (f2) f2 *= th.p;
    o.type = (type === 'square' || !th.w) ? (type || 'sine') : th.w;
    o.frequency.setValueAtTime(f, at);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.03);
  }

  // ضجيج مرشَّح: للتشو تشو والفرامل
  function noise(c, at, dur, vol, f1, f2, q) {
    var s = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf;
    f1 *= th.b; if (f2) f2 *= th.b;
    flt.type = 'bandpass'; flt.Q.value = q || 1.2;
    flt.frequency.setValueAtTime(f1, at);
    if (f2) flt.frequency.exponentialRampToValueAtTime(f2, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    var att = Math.min(0.09, dur * 0.4);   // بداية ناعمة: لا «ضربة»
    g.gain.exponentialRampToValueAtTime(vol, at + att);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    s.connect(flt); flt.connect(g); g.connect(master);

  var N = { c5: 523.25, d5: 587.33, e5: 659.25, g5: 783.99, a5: 880, c6: 1046.5, e6: 1318.5 };

  /* كل الأصوات مؤثرات غير موسيقية: نقرات وفرقعات ونفخات وضجيج مرشَّح.
     لا نغمات متتابعة ولا سلّم ولا لحن، وكل صوت ثابت لا تتغير طبقته مع التكرار
     (بطلب صاحب المشروع: الابتعاد عن أي شبه بالموسيقى). */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function jit(f) { return f * rnd(0.9, 1.12); }      // تغيير طفيف في الطبقة كل مرة (لا تسلسل ولا لحن)
  function click(c, t, f, vol) { tone(c, jit(f) * 0.8, t, 0.07, (vol || 0.06) * 0.8, 'sine', f * 0.5); }   // «توك» خشبي ناعم بدل نقرة حادة
  function bloop(c, t, f0, f1, vol, dur) { tone(c, jit(f0), t, dur || 0.14, vol || 0.07, 'sine', f1); }
  /* تصفيق: ضربات ضجيج قصيرة متراكبة، تتصاعد ثم تخفت */
  function applause(c, t, dur, density, vol) {
    var n = Math.round(dur * density);
    for (var i = 0; i < n; i++) {
      var x = i / n, swell = Math.sin(Math.PI * Math.min(1, x * 1.15)); // مغلاف: يشتد في الوسط
      var at = t + x * dur + rnd(0, 0.03);
      noise(c, at, rnd(0.025, 0.06), vol * (0.4 + 0.8 * swell) * rnd(0.6, 1.1), rnd(1400, 3600), rnd(900, 2200), rnd(0.8, 1.6));
    }
  }
  /* ثلاث صفقات منتظمة */
  function claps(c, t, n, gap, vol) {
    for (var i = 0; i < n; i++) { noise(c, t + i * gap, 0.07, vol, rnd(1800, 2600), 1400, 1.1); noise(c, t + i * gap + 0.012, 0.05, vol * 0.7, rnd(2800, 3600), 2000, 1.4); }
  }
  /* كل اسم يمكن أن يكون دالة أو مصفوفة بدائل؛ يُختار بديل مختلف عن الأخير عشوائياً */
  var SOUNDS = {
    tap: [function (c, t) { click(c, t, 880, 0.05); }, function (c, t) { bloop(c, t, 520, 760, 0.05, 0.08); }],
    whoosh: [
      function (c, t) { noise(c, t, 0.5, 0.035, 350, 1500, 0.5); },                              // هواء يرتفع بنعومة
      function (c, t) { noise(c, t, 0.5, 0.035, 1700, 400, 0.5); },                              // هواء يهبط
      function (c, t) { noise(c, t, 0.45, 0.03, 700, 1200, 0.4); noise(c, t + 0.05, 0.4, 0.02, 2200, 1000, 0.5); }
    ],
    card: [function (c, t) { noise(c, t, 0.16, 0.04, 2800, 1500, 0.9); }, function (c, t) { bloop(c, t, 420, 640, 0.05, 0.1); }, function (c, t) { noise(c, t, 0.2, 0.035, 2000, 1000, 0.7); }],
    pop: [function (c, t) { tone(c, jit(300), t, 0.07, 0.08, 'sine', 700); }, function (c, t) { tone(c, jit(420), t, 0.06, 0.08, 'sine', 900); noise(c, t, 0.03, 0.02, 4000, 3000, 1); }, function (c, t) { tone(c, jit(240), t, 0.09, 0.08, 'sine', 520); }],
    sparkle: [function (c, t) { noise(c, t, 0.25, 0.035, 7000, 9000, 2); }, function (c, t) { for (var i = 0; i < 4; i++) noise(c, t + i * 0.05, 0.05, 0.03, rnd(6000, 9000), 8000, 2.5); }],
    chug: function (c, t, a) { noise(c, t, 0.12, 0.035 * (a == null ? 1 : a), 700, 300, 0.9); },
    brake: function (c, t) { noise(c, t, 0.9, 0.045, 2600, 500, 0.7); },
    toot: function (c, t) { noise(c, t, 0.5, 0.05, 1200, 900, 3); },
    /* صواب: أصوات قصيرة مختلفة */
    right: [
      function (c, t) { tone(c, jit(260), t, 0.08, 0.09, 'sine', 620); noise(c, t + 0.02, 0.15, 0.03, 6000, 8000, 2); },     // بوب مع لمعة
      function (c, t) { click(c, t, 520, 0.09); click(c, t + 0.07, 640, 0.07); },                                           // طقّتان خشبيتان
      function (c, t) { tone(c, jit(200), t, 0.14, 0.09, 'sine', 160); tone(c, jit(200), t + 0.14, 0.12, 0.08, 'sine', 380); }, // «بوينغ» زنبركي
      function (c, t) { noise(c, t, 0.18, 0.05, 1200, 5000, 0.9); tone(c, jit(340), t + 0.1, 0.06, 0.07, 'sine', 800); },       // زِب + فقاعة
      function (c, t) { for (var i = 0; i < 3; i++) tone(c, jit(700), t + i * 0.05, 0.04, 0.05, 'triangle', 1100); }            // زخّات ناعمة
    ],
    wrong: function (c, t) { tone(c, 480, t, 0.09, 0.06, 'square'); tone(c, 480, t + 0.14, 0.09, 0.06, 'square'); },
    place: [function (c, t) { click(c, t, 360, 0.09); noise(c, t, 0.08, 0.025, 900, 600, 0.8); }, function (c, t) { bloop(c, t, 300, 190, 0.08, 0.12); }, function (c, t) { click(c, t, 300, 0.09); }],
    pick: [function (c, t) { click(c, t, 700, 0.05); }, function (c, t) { bloop(c, t, 480, 720, 0.05, 0.09); }, function (c, t) { click(c, t, 820, 0.045); noise(c, t, 0.05, 0.015, 3000, 2500, 1); }],
    flutter: function (c, t) { for (var i = 0; i < 6; i++) noise(c, t + i * 0.09, 0.06, 0.035, 3000, 1500, 1.5); },
    lantern: [function (c, t) { tone(c, jit(300), t, 0.07, 0.07, 'sine', 700); }, function (c, t) { tone(c, jit(360), t, 0.06, 0.07, 'sine', 820); }],
    splash: [function (c, t) { noise(c, t, 0.35, 0.07, 1800, 500, 0.8); }, function (c, t) { noise(c, t, 0.3, 0.07, 2400, 700, 0.7); noise(c, t + 0.12, 0.2, 0.04, 1500, 500, 0.9); }],
    sweep: [function (c, t) { noise(c, t, 0.5, 0.05, 3000, 600, 0.6); }, function (c, t) { noise(c, t, 0.45, 0.05, 700, 2800, 0.6); }],
    chime: [function (c, t) { tone(c, jit(300), t, 0.07, 0.07, 'sine', 700); }, function (c, t) { tone(c, jit(380), t, 0.06, 0.07, 'sine', 860); }],
    soft: function (c, t) { noise(c, t, 0.12, 0.03, 900, 600, 1); },
    /* فوز: تصفيق بأشكال مختلفة */
    cheer: [
      function (c, t) { applause(c, t, 1.7, 38, 0.05); },                                                       // تصفيق جمهور كثيف
      function (c, t) { claps(c, t, 4, 0.16, 0.06); applause(c, t + 0.7, 1.1, 24, 0.045); },                    // صفقات منتظمة ثم تصفيق
      function (c, t) { noise(c, t, 0.35, 0.05, 600, 3500, 0.8); applause(c, t + 0.25, 1.4, 30, 0.05); },        // همسة ثم تصفيق
      function (c, t) { claps(c, t, 3, 0.22, 0.07); noise(c, t + 0.8, 0.5, 0.03, 7000, 9000, 2); },             // ثلاث صفقات ولمعة
      function (c, t) { for (var i = 0; i < 6; i++) { tone(c, jit(260), t + i * 0.09, 0.05, 0.06, 'sine', 700); } applause(c, t + 0.1, 1.2, 28, 0.04); } // فرقعات احتفال + تصفيق
    ],
    /* تقليب صفحة: حفيف ورق ناعم */
    page: [
      function (c, t) { noise(c, t, 0.22, 0.045, 3500, 1800, 0.7); noise(c, t + 0.09, 0.14, 0.03, 4200, 2600, 0.8); },
      function (c, t) { noise(c, t, 0.26, 0.04, 2600, 5200, 0.6); noise(c, t + 0.12, 0.12, 0.025, 3800, 2200, 0.9); },
      function (c, t) { noise(c, t, 0.2, 0.045, 4500, 1500, 0.6); }
    ],
    /* فتح: انفتاح باب/كتاب بنفَس صاعد وفقاعة ناعمة */
    open: [
      function (c, t) { noise(c, t, 0.4, 0.035, 500, 2600, 0.5); bloop(c, t + 0.18, 300, 640, 0.06, 0.16); },
      function (c, t) { bloop(c, t, 260, 560, 0.06, 0.18); noise(c, t + 0.05, 0.35, 0.03, 900, 3000, 0.5); }
    ],
    /* إغلاق: هبوط ناعم */
    close: [
      function (c, t) { noise(c, t, 0.4, 0.035, 2600, 450, 0.5); bloop(c, t + 0.1, 560, 260, 0.06, 0.16); },
      function (c, t) { bloop(c, t, 520, 240, 0.06, 0.18); noise(c, t + 0.05, 0.3, 0.025, 2000, 600, 0.5); }
    ],
    bloop: [function (c, t) { bloop(c, t, 280, 620, 0.07, 0.14); }, function (c, t) { bloop(c, t, 360, 780, 0.07, 0.12); }, function (c, t) { bloop(c, t, 240, 500, 0.07, 0.16); }],
    lullaby: [function (c, t) { noise(c, t, 1.4, 0.03, 600, 300, 0.6); }, function (c, t) { noise(c, t, 1.6, 0.028, 500, 250, 0.5); }]
  };
  var lastVar = {};
  function pickVariant(name) {
    var v = SOUNDS[name];
    if (!Array.isArray(v)) return v;
    var i = Math.floor(Math.random() * v.length);
    if (v.length > 1 && i === lastVar[name]) i = (i + 1 + Math.floor(Math.random() * (v.length - 1))) % v.length;
    lastVar[name] = i;
    return v[i];
  }

  /* iOS يُسكت WebAudio حين يكون مفتاح الكتم الجانبي مفعّلاً، إلا إذا كانت الصفحة
     تشغّل عنصر صوت. نشغّل مقطعاً صامتاً (٠ شدة) متكرراً داخل اللمسة الأولى فتنتقل جلسة الصوت إلى «تشغيل». */
  var keep = null;
  function keepAlive() {
    if (keep) return;

      keep = document.createElement('audio');
      keep.setAttribute('playsinline', '');
      keep.loop = true; keep.volume = 0.01;
      keep.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==';
      var p = keep.play(); if (p && p.catch) p.catch(function () { keep = null; });
    } catch (e) { keep = null; }
  }

  B.audio = {
    theme: function (id) { var i = ORDER.indexOf(id); th = i < 0 ? T0 : THEMES[(i % (THEMES.length - 1)) + 1]; },
    unlock: function () {
      var c = ensure();
      if (!c) return;

      }
    },
    play: function (name, arg) {
      if (B.mate) B.mate.react(name);
      if (!enabled()) return;
      var c = ensure();
      if (!c) return;
      var fn = pickVariant(name);
      if (!fn) return;
      var raw = (name === 'wrong' || name === 'chug' || name === 'toot' || name === 'brake');
      function go() { var keep = th; if (raw) th = T0; try { fn(c, c.currentTime + 0.005, arg); } catch (e) {} th = keep; }
      if (c.state === 'running') { go(); return; }

      try { c.resume().then(function () { if (c.state === 'running') go(); }, function () {}); } catch (e) {}
    }
  };
})();

</script>
<script>
/* إحصاءات مجهولة لصاحب المشروع: عدّادات في قاعدة Firebase Realtime Database مجانية (رابطها في B.S.statsDb).
   لا يُرسل أي اسم أو بيانات شخصية: فقط زيادة عدّاد. يبقى معطّلاً إن كان statsDb فارغاً.
   العدّادات تحت stats/:  open (فتحات) · devices/new (أجهزة زارت) · devices/player (أجهزة لعبت)
                           play/<لعبة> (مرات البدء) · done/<لعبة> (جلسات مكتملة)
   كل جهاز يُعدّ مرة واحدة في new وفي player (عبر علامة في localStorage). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  function base() {
    var u = B.S && B.S.statsDb;
    var local = /localhost|127\.0\.0\.1/;
    // لا نحسب فتح الملف محلياً ولا التجارب على جهازك (إلا إن كانت القاعدة نفسها محلية للاختبار)
    if (!u || window.location.protocol === 'file:' || (local.test(window.location.hostname) && !local.test(u))) return '';
    return u.replace(/\/+$/, '');
  }
  function once(flag) {
    try {
      if (window.localStorage.getItem(flag)) return false;
      window.localStorage.setItem(flag, '1');
      return true;
    } catch (e) { return false; }
  }
  /* زيادة عدّاد: PATCH بقيمة الخادم increment (ذرّية، لا تضيع الأرقام مع التزامن) */
  function dayKey() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function bump(group, key) {
    var b = base();
    if (!b || !window.fetch) return;
    var inc = { '.sv': { increment: 1 } }, body = {};
    body[group + '/' + key] = inc;                                   // الإجمالي
    body['days/' + dayKey() + '/' + group + '/' + key] = inc;       // اليومي (للتقارير بالتواريخ)
    try { window.fetch(b + '/stats.json', { method: 'PATCH', body: JSON.stringify(body), keepalive: true }).catch(function () {}); } catch (e) {}
  }

  B.stats = {
    enabled: function () { return !!(B.S && B.S.statsDb); },
    open: function () { bump('events', 'open'); if (once('bustan.dev.new')) bump('devices', 'new'); },
    play: function (id) { bump('play', id); if (once('bustan.dev.player')) bump('devices', 'player'); },
    done: function (id) { bump('done', id); },
    /* قراءة كل العدّادات (للوحة الإدارة) */
    read: function () {
      var u = B.S.statsDb;
      if (!u) return Promise.reject(new Error('no db'));
      return window.fetch(u.replace(/\/+$/, '') + '/stats.json').then(function (r) { return r.json(); });
    }
  };

  /* إعدادات عن بعد يتحكم بها صاحب المشروع من لوحة الإدارة: إيقاف المنصة، وإخفاء ألعاب.
     تُحفظ نسخة محلية فتعمل دون إنترنت. config = { off, msg, hidden:{id:true} } */
  var CK = 'bustan.config', cfgShown = '';
  B.config = {
    off: false, msg: '', hidden: {},
    isHidden: function (id) { return !!B.config.hidden[id]; },
    _set: function (c) { c = c || {}; B.config.off = !!c.off; B.config.msg = c.msg || ''; B.config.hidden = c.hidden || {}; },
    init: function () { try { B.config._set(JSON.parse(window.localStorage.getItem(CK) || '{}')); } catch (e) {} cfgShown = JSON.stringify([B.config.off, B.config.msg, B.config.hidden]); B.config.applyOff(); },
    load: function () {
      var b = base(); if (!b || !window.fetch) return Promise.resolve();
      return window.fetch(b + '/config.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) {
        c = c || {}; B.config._set(c);
        try { window.localStorage.setItem(CK, JSON.stringify({ off: B.config.off, msg: B.config.msg, hidden: B.config.hidden })); } catch (e) {}
        var now = JSON.stringify([B.config.off, B.config.msg, B.config.hidden]);
        B.config.applyOff();
        if (now !== cfgShown) { cfgShown = now; if (B.home && B.home.refresh) B.home.refresh(); }
      }).catch(function () {});
    },
    save: function (cfg, key) {
      var u = B.S.statsDb; if (!u) return Promise.reject(new Error('no db'));
      var body = { off: !!cfg.off, msg: cfg.msg || '', hidden: cfg.hidden || {}, key: key || '', updated: Date.now() };
      return window.fetch(u.replace(/\/+$/, '') + '/config.json', { method: 'PUT', body: JSON.stringify(body) }).then(function (r) { if (!r.ok) throw new Error('write'); return r.json(); });
    },
    readRemote: function () { var u = B.S.statsDb; if (!u) return Promise.resolve({}); return window.fetch(u.replace(/\/+$/, '') + '/config.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) { return c || {}; }); },
    applyOff: function () {
      var lay = document.querySelector('.off-overlay');
      if (!B.config.off) { if (lay) lay.remove(); return; }
      if (lay) { lay.querySelector('p').textContent = B.config.msg || B.S.cfg.defaultMsg; return; }
      var h = B.UI.h;
      document.body.appendChild(h('div', { class: 'rest-overlay off-overlay', role: 'dialog', style: { zIndex: 500 } },
        h('div', { class: 'rest-card' }, h('div', { class: 'rest-bear', html: B.art.animal('bear', { sleep: true }) }), h('h2', { text: B.S.cfg.offTitle }), h('p', { text: B.config.msg || B.S.cfg.defaultMsg }))));
    }
  };
})();

</script>
<script>
/* «بستاني»: بستان دائم يكبر مع كل جلسة تكتمل (شجرة، زهرة، حيوان…).
   لا نقاط ولا نجوم ولا سلاسل أيام: المكافأة أن يحيا ما أنجزه. يُحفظ في التخزين (garden). */
(function () {

  // تلّة دورية: مجموع جيوب بتردد صحيح فتتصل الحافتان
  function hillFn(w, base, waves) {
    return function (x) {
      var y = base;
      for (var j = 0; j < waves.length; j++) {
        var wv = waves[j];

    };

    for (var i = 0; i <= steps; i++) {

    }
    return d + 'L' + w + ' ' + h + 'Z';
  }

  /* kind: far | mid | clouds | fore | ties */
  function sceneTile(kind, w, h) {
    var s = '', fn;
    if (kind === 'far') {
      fn = hillFn(w, h * 0.78, [{ a: h * 0.42, k: 2, p: 0.6 }, { a: h * 0.12, k: 5, p: 2.0 }]);
      s = '<path d="' + hillPath(w, h, fn) + '" fill="#A5E3D5"/>';
    } else if (kind === 'mid') {
      fn = hillFn(w, h * 0.9, [{ a: h * 0.4, k: 3, p: 1.7 }, { a: h * 0.1, k: 7, p: 0.4 }]);

        tree(w * 0.5, at(0.5), 1.25, '#2FA886') + bush(w * 0.68, at(0.68), 1.2, '#3DB993') +
        tree(w * 0.86, at(0.86), 0.95, '#2FA886') + bush(w * 0.33, at(0.33), 1, '#3DB993');
    } else if (kind === 'gfar') {   // تلال بعيدة خضراء فاتحة بأشجار صغيرة
      fn = hillFn(w, h * 0.78, [{ a: h * 0.42, k: 2, p: 0.6 }, { a: h * 0.12, k: 5, p: 2.0 }]);
      s = '<path d="' + hillPath(w, h, fn) + '" fill="#BFEFB4"/>';
      var af = function (f) { return fn(w * f) + 3; };
      s += tree(w * 0.2, af(0.2), 0.55, '#9ADB93') + tree(w * 0.26, af(0.26), 0.45, '#8AD18A') + tree(w * 0.72, af(0.72), 0.6, '#9ADB93') + bush(w * 0.5, af(0.5), 0.7, '#8AD18A');
    } else if (kind === 'gmid') {   // تلال أمامية بأشجار متنوعة وزهور
      fn = hillFn(w, h * 0.9, [{ a: h * 0.4, k: 3, p: 1.7 }, { a: h * 0.1, k: 7, p: 0.4 }]);
      s = '<path d="' + hillPath(w, h, fn) + '" fill="#79D679"/>';
      var am = function (f) { return fn(w * f) + 4; };
      s += tree(w * 0.07, am(0.07), 1.2, '#3FAE5E') + tree(w * 0.15, am(0.15), 0.85, '#5CC56E') + tree(w * 0.38, am(0.38), 0.9, '#F7A3C0') +
        bush(w * 0.55, am(0.55), 1.1, '#3FAE5E') + tree(w * 0.64, am(0.64), 1.05, '#5CC56E') + tree(w * 0.93, am(0.93), 1.3, '#3FAE5E') + bush(w * 0.8, am(0.8), 0.9, '#58C46A');
      var fc = ['#FFD34E', '#F2658E', '#FFFFFF', '#B79BFF', '#FF8A3D'];
      for (var q = 0; q < 16; q++) { var fx = (0.03 + q * 0.061 + (q % 3) * 0.01); s += flower(w * fx, fn(w * fx) + 14 + (q % 3) * 7, fc[q % 5]); }
    } else if (kind === 'clouds') {
      var c = '<g transform="translate(%X %Y) scale(%S)">' + cloud().replace(/<svg[^>]*>|<\/svg>/g, '') + '</g>';
      s = c.replace('%X', w * 0.05).replace('%Y', h * 0.15).replace('%S', 0.9) +
        c.replace('%X', w * 0.42).replace('%Y', h * 0.45).replace('%S', 0.6) +
        c.replace('%X', w * 0.72).replace('%Y', h * 0.1).replace('%S', 0.75);
    } else if (kind === 'fore') {
      var cols = ['#FFD34E', '#F2658E', '#FAFCFF', '#B79BFF'];
      for (var i = 0; i < 12; i++) {
        s += flower(w * (0.03 + i * 0.082 + (i % 2) * 0.02), h * (0.5 + (i % 4) * 0.14), cols[i % 4]).replace('<g ', '<g ').replace('translate(', 'translate(');
      }
      s += bush(w * 0.22, h * 0.98, 1.5, '#1F9C7D') + bush(w * 0.7, h * 0.95, 1.2, '#1F9C7D') + fence(w * 0.44, h * 0.9, 1.25) + bush(w * 0.93, h * 0.97, 1.3, '#27AE8B');
    } else if (kind === 'ties') {
      var n = 8, gap = w / n;
      for (var t = 0; t < n; t++) {

    var cover = anim(disc, [{ transform: 'scale(0.02)' }, { transform: 'scale(1)' }], { dur: 460, easing: 'cubic-bezier(.5,0,.3,1)' });
    return {
      cover: cover,
      reveal: function () {
        return anim(wrap, [{ opacity: 1 }, { opacity: 0 }], { dur: 380, fill: 'both' }).then(function () { wrap.remove(); });
      }
    };
  }

  /* ───── جسيمات الاحتفال (بتلات ودوائر وقلوب، بلا نجوم) ───── */
  var CONFETTI = ['#FFD34E', '#F2658E', '#3D8BFD', '#19B394', '#8E5CF0', '#FF8A3D'];
  function burst(parent, x, y, o) {
    if (reduced()) return;
    o = o || {};
    var n = o.n || 16, spread = o.spread || 110, dur = o.dur || 1100, cols = o.colors || CONFETTI;
    for (var i = 0; i < n; i++) {
      var s = 7 + Math.random() * 8;
      var shape = i % 3;
      var p = h('span', {
        class: 'confetti',
        style: {
          left: x + 'px', top: y + 'px', width: s + 'px', height: (shape === 1 ? s * 1.6 : s) + 'px',
          background: cols[i % cols.length], borderRadius: shape === 1 ? '50% 50% 50% 50% / 70% 70% 30% 30%' : '50%'
        }
      });
      parent.appendChild(p);
      var ang = (-Math.PI / 2) + (Math.random() - 0.5) * 2.4;
      var dist = spread * (0.5 + Math.random() * 0.7);
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      anim(p, [
        { transform: 'translate(0,0) scale(.3) rotate(0)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1) rotate(' + (Math.random() * 240 - 120) + 'deg)', opacity: 1, offset: 0.55 },
        { transform: 'translate(' + dx * 1.15 + 'px,' + (dy + 70) + 'px) scale(.9) rotate(' + (Math.random() * 360 - 180) + 'deg)', opacity: 0 }
      ], { dur: dur, delay: i * 14, easing: 'cubic-bezier(.2,.7,.4,1)' }).then((function (el) {
        return function () { el.remove(); };
      })(p));
    }
  }

  /* ───── مصابيح الجلسة ───── */
  function bulbs(n) {
    var wrap = h('div', { class: 'bulbs', 'data-count': n });
    wrap.style.setProperty('--n', n);
    var list = [];
    wrap.appendChild(h('div', { class: 'wire' }));
    for (var i = 0; i < n; i++) {
      var b = h('div', { class: 'bulb', html: B.art.bulb() });
      list.push(b); wrap.appendChild(b);
    }
    return {
      el: wrap,
      light: function (i) {
        var b = list[i];
        if (!b) return Promise.resolve();
        b.classList.add('lit');
        if (B.audio) B.audio.play('chime', i);
        return anim(b, [{ transform: 'scale(1)' }, { transform: 'scale(1.55)' }, { transform: 'scale(1)' }], { dur: 560, easing: SPRING, fill: 'none' });
      },
      litCount: function () { return list.filter(function (x) { return x.classList.contains('lit'); }).length; }
    };
  }

  function iconButton(cls, svgStr, label, fn, o) {
    var b = h('button', { class: 'hud-btn ' + cls, type: 'button', 'aria-label': label, html: svgStr });
    bindPress(b, fn, o);
    return b;
  }

  /* حمايات اللمس: لا تكبير ولا تحديد ولا نقر مزدوج ولا تمرير */
  function installGuards() {
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { e.preventDefault(); });
    });
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchmove', function (e) {
      if (!e.target.closest || !e.target.closest('.scrollable, .parent-overlay')) e.preventDefault();
    }, { passive: false });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) {
      var t = e.target && e.target.closest ? e.target.closest('textarea,input') : null;
      if (!t) e.preventDefault();
    });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) {
      document.addEventListener(ev, function () { if (B.audio) B.audio.unlock(); }, true);
    });
  }

  B.UI = {
    ts: ts,
    EASE: EASE,
    SPRING: SPRING,
    reduced: reduced,
    h: h,
    fromSvg: fromSvg,
    num: num,
    sleep: sleep,
    anim: anim,
    bindPress: bindPress,
    vp: vp,
    go: go,
    root: root,
    current: function () { return current; },
    curtain: curtain,
    burst: burst,
    bulbs: bulbs,
    iconButton: iconButton,
    installGuards: installGuards
  };
})();

<script>
/* عُدّة مشتركة للألعاب: اليد الكرتونية، جولة الاختيار مع سلّم المساعدة، ردود الصواب والخطأ،
   والشاشة الختامية العامة. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art;

  function rand(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rand(a.length)]; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function center(el, rel) {
    var r = el.getBoundingClientRect(), s = rel.getBoundingClientRect();
    return { x: r.left + r.width / 2 - s.left, y: r.top + r.height / 2 - s.top, w: r.width, h: r.height };
  }

  /* يد تشير من الأسفل إلى نقطة (طرف الإصبع عند x,y) */
  function hand(layer, x, y) {
    var size = UI.vp().tablet ? 110 : 84, k = size / 96;
    var el = h('div', { class: 'kit-hand', style: { width: 88 * k + 'px', height: size + 'px', left: x - 44 * k + 'px', top: y - 2 * k + 'px' }, html: art.hand() });
    layer.appendChild(el);
    UI.anim(el, [{ opacity: 0, transform: 'translateY(60px)' }, { opacity: 1, transform: 'none' }], { dur: 450, easing: UI.SPRING, fill: 'none' });
    var cx = x, cy = y;
    return {
      el: el,
      moveTo: function (nx, ny) {
        var p = UI.anim(el, [{ transform: 'translate(0,0)' }, { transform: 'translate(' + (nx - cx) + 'px,' + (ny - cy) + 'px)' }], { dur: 600, fill: 'none' });
        return p.then(function () { cx = nx; cy = ny; el.style.left = nx - 44 * k + 'px'; el.style.top = ny - 2 * k + 'px'; });
      },
      tap: function () {
        return UI.anim(el, [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-10px) scale(.94)' }, { transform: 'translateY(0) scale(1)' }], { dur: 380, fill: 'none' });
      },
      remove: function () {
        return UI.anim(el, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(40px)' }], { dur: 350 }).then(function () { el.remove(); });
      }
    };
  }

  /* رد الخطأ: اهتزاز لطيف وصوت خطأ (بلا لون أحمر ولا كلمات) */
  function wrong(el) {
    if (B.audio) B.audio.play('wrong');
    return UI.anim(el, [
      { transform: 'translateX(0)' }, { transform: 'translateX(-9px) rotate(-3deg)' }, { transform: 'translateX(9px) rotate(3deg)' },
      { transform: 'translateX(-6px)' }, { transform: 'translateX(0)' }
    ], { dur: 420, fill: 'none' });
  }
  /* رد الصواب: قفزة فرِحة وصوت صواب */
  function right(el) {
    if (B.audio) B.audio.play('right');
    return UI.anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { dur: 420, easing: UI.SPRING, fill: 'none' });
  }

  /* جولة اختيار من أزرار: تُرجع {promise, cancel}.
     سلّم المساعدة: بعد إخفاقين ينبض الصحيح، وبعد الثالث تُظهر اليد الحل وتُكمل الجولة.
     o.demo: اليد تحلّ مباشرة (العرض التوضيحي). o.onWrong(el) اختياري. */
  function choice(ctx, layer, btns, correct, o) {
    o = o || {};
    var done = false, fails = 0, errors = 0, busy = false, hd = null, resolve;
    var promise = new Promise(function (res) { resolve = res; });
    function finish(el) {
      if (done) return;
      done = true;
      btns.forEach(function (b) { b.classList.remove('pulse-hint'); });
      right(el);
      resolve({ errors: errors, el: el });
    }
    async function showSolution() {
      busy = true;
      var c = center(btns[correct], layer);
      hd = hand(layer, c.x, c.y + c.h * 0.18);
      await ctx.sleep(650);
      if (done) return;
      await hd.tap();
      if (done) return;
      btns[correct].classList.add('pressed');
      setTimeout(function () { btns[correct].classList.remove('pressed'); }, 250);
      hd.remove(); hd = null;
      finish(btns[correct]);
    }
    btns.forEach(function (b, i) {
      b.__pick = function () {
        if (done || busy || o.demo) return;
        if (i === correct) { finish(b); return; }
        errors++; fails++;
        wrong(b);
        if (o.onWrong) o.onWrong(b, i);
        if (fails === 2) btns[correct].classList.add('pulse-hint');
        if (fails >= 3) showSolution();
      };
      UI.bindPress(b, function () { b.__pick(); });
    });
    if (o.demo) ctx.sleep(o.demoDelay || 900).then(function () { if (!done) showSolution(); });
    return {
      promise: promise,
      cancel: function () { done = true; if (hd) hd.el.remove(); resolve({ cancelled: true }); }
    };
  }

  /* شاشة ختامية عامة: قمر ونجوم وحيوان نائم */
  function endScene(animal, extra) {
    var stars = h('div', { class: 'end-stars' });
    for (var i = 0; i < 26; i++) {
      stars.appendChild(h('span', { class: 'end-star', style: { left: Math.random() * 100 + '%', top: Math.random() * 55 + '%', width: 6 + Math.random() * 10 + 'px', animationDelay: Math.random() * 3 + 's' }, html: art.sparkle('#FFF7C2') }));
    }
    var fire = h('div', { class: 'end-fire' });
    for (var f = 0; f < 10; f++) {
      fire.appendChild(h('span', { class: 'firefly', style: { left: Math.random() * 100 + '%', top: 60 + Math.random() * 35 + '%', animationDelay: Math.random() * 4 + 's', animationDuration: 4 + Math.random() * 3 + 's' } }));
    }
    var sleeper = animal === 'owl' ? art.owl({ sleep: true }) : art.animal(animal || 'bear', { sleep: true });
    return h('div', { class: 'end-train-wrap' }, stars, fire,
      h('div', { class: 'end-moon', html: art.moon() }),
      h('div', { class: 'end-owl end-sleeper' }, h('div', { html: sleeper }), h('span', { class: 'end-z', html: art.zzz() })),
      extra || null);
  }

  /* غروب هادئ فوق المسرح قبل الختام */
  function dusk(ctx) {
    var d = h('div', { class: 'kit-dusk' });
    ctx.stage.appendChild(d);
    if (B.audio) B.audio.play('lullaby');
    UI.anim(d, [{ opacity: 0 }, { opacity: 1 }], { dur: 1800 });
    return ctx.sleep(2000);
  }

  /* غلاف الجولات: يتكفل بالإلغاء (إعادة العرض) والرموز المميّزة للجولة */
  function roundRunner() {
    var token = 0, cancelFn = null, cur = null;
    return {
      run: function (fn) {
        var my = ++token;
        return new Promise(function (res) {
          cancelFn = function () { res({ cancelled: true }); };
          Promise.resolve(fn(function () { return my === token; }, function (c) { cur = c; })).then(function (r) { if (my === token && r) res(r); });
        });
      },
      cancel: function () { token++; if (cur && cur.cancel) cur.cancel(); cur = null; if (cancelFn) cancelFn(); cancelFn = null; },
      stop: function () { token++; }
    };
  }

  B.kit = { rand: rand, pick: pick, shuffle: shuffle, center: center, hand: hand, wrong: wrong, right: right, choice: choice, endScene: endScene, dusk: dusk, roundRunner: roundRunner };
})();

</script>
<script>
/* محرك الجلسات: يدير جولات اللعبة (١٠ في «وحدي» و٨ في «معك»)،
   ومصابيح التقدم، والتكيّف الصامت، والحفظ بعد كل جولة، والشاشة الختامية الهادئة.

   عقد اللعبة (B.games[id]):
     mount(ctx)                  يبني المشهد داخل ctx.stage
     demo(ctx)        → Promise  عرض توضيحي صامت (يد تنقر)
     playRound(ctx, level, i) → Promise<{errors}|{cancelled:true}>
     cancelRound()               يُنهي الجولة الحالية بـ cancelled
     outro(ctx)       → Promise  خروج هادئ من المشهد قبل الختام
     endArt(ctx)      → Element  رسمة الشاشة الختامية
     destroy()                   تنظيف (مؤقتات، rAF)
   ملاحظة: ctx.sleep وctx.anim لا ينتهيان إذا غادرت الطفل اللعبة (لا أخطاء متأخرة). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h;

  /* فهرس الألعاب: المنطقة وعدد الجولات */
  B.catalog = [
    // «وحدي» مجمّعة بمهارتها (cat): تظهر في الرئيسية تحت عناوين صغيرة
    { id: 'memory', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'shadows', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'odd', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'hide', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'vanish', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'missing', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'fruits', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'more', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'order', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'mirror', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'pattern', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'letters', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'tracing', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'train', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'feed', zone: 'solo', rounds: 10, cat: 'know' },
    { id: 'habitat', zone: 'solo', rounds: 10, cat: 'know' },
    { id: 'water', zone: 'solo', rounds: 10, cat: 'know' },
    { id: 'maze', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'treasure', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'mimic', zone: 'together', rounds: 8 },
    { id: 'firstsound', zone: 'together', rounds: 8 },
    { id: 'bridge', zone: 'together', rounds: 8 },
    // القسم الإبداعي: لعب حرّ بلا جولات ولا مصابيح
    { id: 'workshop', zone: 'create', free: true },
    { id: 'coloring', zone: 'create', free: true },
    { id: 'drawing', zone: 'create', free: true },
    { id: 'scene', zone: 'create', free: true },
    { id: 'gallery', zone: 'create', free: true },
    { id: 'stories', zone: 'together', free: true, hidden: true },
    { id: 'garden', zone: 'garden', free: true }
  ];
  B.free = B.free || {};
  B.games = B.games || {};

  var active = null;

  function item(id) {
    for (var i = 0; i < B.catalog.length; i++) if (B.catalog[i].id === id) return B.catalog[i];
    return null;
  }

  /* لعب حرّ: مسرح وزر الرئيسية فقط */
  function startFree(it, origin) {
    if (B.audio) B.audio.theme(it.id);
    if (it.id === 'garden') { /* يستعمل المحرك نفسه */ }
    var mod = B.free[it.id];
    if (!mod || active) return;
    if (B.audio) B.audio.play('whoosh');
    B.stats.play(it.id);
    var cur = UI.curtain('#8E5CF0', origin.x, origin.y);
    cur.cover.then(function () {
      var stage = h('div', { class: 'stage' });
      var ctx = { gameId: it.id, zone: it.zone, stage: stage, alive: true, free: true };
      ctx.homeBtn = UI.iconButton('home-btn', B.art.house(), B.S.buttons.home, function () { exit(ctx, mod); });
      ctx.hud = h('div', { class: 'hud' }, ctx.homeBtn);
      ctx.root = h('div', { class: 'screen game-screen free-screen game-' + it.id, 'data-game': it.id }, stage, ctx.hud);
      active = ctx;
      UI.go(ctx.root, { instant: true });
      try { mod.open(ctx); } catch (e) { console.error(e); }
      cur.reveal();
    });
  }

  function start(id, origin) {
    if (B.config && B.config.isHidden(id)) return;
    if (B.audio) B.audio.theme(id);
    var game = B.games[id], it = item(id);
    origin = origin || {};
    if (it && it.free) { startFree(it, origin); return; }
    if (!game || !it || active) return;
    var color = it.zone === 'solo' ? '#19B394' : '#F2658E';
    if (B.audio) B.audio.play('whoosh');
    B.stats.play(id);
    var cur = UI.curtain(color, origin.x, origin.y);
    cur.cover.then(function () {
      var ctx = build(it, game);
      active = ctx;
      UI.go(ctx.root, { instant: true });
      return cur.reveal().then(function () { loop(ctx, game); });
    });
  }

  function build(it, game) {
    var S = B.S;
    var stage = h('div', { class: 'stage' });
    var bulbs = UI.bulbs(it.rounds);
    var ctx = {
      gameId: it.id, zone: it.zone, total: it.rounds,
      stage: stage, bulbs: bulbs,
      alive: true, demoRunning: false, pendingDemo: false, ending: false,
      roundIndex: 0
    };
    ctx.homeBtn = UI.iconButton('home-btn', B.art.house(), S.buttons.home, function () { exit(ctx, game); });
    // شريط الأعلى: زر الرئيسية فقط والمصابيح (مساحة فارغة تعادل الزر لتبقى المصابيح في الوسط)
    // شريط الأعلى: الرئيسية (يمين) — المصابيح — إيقاف مؤقت (يسار)
    ctx.pauseBtn = UI.iconButton('pause-btn', B.art.pauseIcon(), S.buttons.pause, function () { pause(ctx, game); });
    ctx.hud = h('div', { class: 'hud' }, ctx.homeBtn, bulbs.el, ctx.pauseBtn);
    ctx.root = h('div', { class: 'screen game-screen game-' + it.id, 'data-game': it.id, 'data-zone': it.zone }, stage, ctx.hud);
    if (B.mate) B.mate.attach(ctx.root, it.id);

    // انتظار وحركة آمنان: لا يكملان بعد الخروج من اللعبة
    function guard(v) { return ctx.alive ? v : new Promise(function () {}); }
    /* انتظار يتجمّد مع الإيقاف المؤقت: يُحسب الوقت المتبقي ويُستأنف بعد المتابعة */
    ctx.timers = [];
    ctx.paused = false;
    ctx.sleep = function (ms) {
      return new Promise(function (res) {
        var t = { rem: ms / UI.ts, id: 0, t0: 0, on: false };
        t.start = function () { t.on = true; t.t0 = performance.now(); t.id = setTimeout(t.done, Math.max(0, t.rem)); };
        t.stop = function () { if (!t.on) return; t.on = false; clearTimeout(t.id); t.rem -= performance.now() - t.t0; };
        t.done = function () { ctx.timers = ctx.timers.filter(function (x) { return x !== t; }); if (ctx.alive) res(); };
        ctx.timers.push(t);
        if (!ctx.paused) t.start();
      });
    };
    ctx.anim = function (el, kf, o) { return UI.anim(el, kf, o).then(guard); };
    return ctx;
  }

  async function runDemo(ctx, game) {
    ctx.demoRunning = true;
    ctx.root.classList.add('is-demo');
    await game.demo(ctx);
    ctx.demoRunning = false;
    ctx.root.classList.remove('is-demo');
  }

  async function loop(ctx, game) {
    var id = ctx.gameId;
    try {
      game.mount(ctx);
      await ctx.sleep(500);
      if (B.S.guides[id]) await showGuide(ctx, B.S.guides[id]);
      if (!B.storage.demoSeen(id)) {
        await runDemo(ctx, game);
        B.storage.markDemoSeen(id);
        await ctx.sleep(900);
      }
      var i = 0;
      while (i < ctx.total) {
        if (ctx.pendingDemo) {
          ctx.pendingDemo = false;
          await runDemo(ctx, game);
          await ctx.sleep(900);
        }
        ctx.roundIndex = i;
        var level = B.adaptive.level(id);
        var res = await game.playRound(ctx, level, i);
        if (res && res.cancelled) { ctx.pendingDemo = true; continue; } // نكرر الجولة نفسها بعد العرض
        B.adaptive.report(id, (res && res.errors) | 0);
        B.storage.recordRound(id);
        ctx.bulbs.light(i);
        i++;
        if (i < ctx.total) await ctx.sleep(1000);
      }
      B.storage.recordSession(id);
      B.stats.done(id);
      ctx.ending = true;
      await ctx.sleep(500);
      await game.outro(ctx);
      showEnd(ctx, game);
    } catch (e) {
      console.error(e);
    }
  }

  /* بطاقة شرح لوليّ الأمر (ألعاب «معك»): خطوات قصيرة وزر بدء */
  function showGuide(ctx, g) {
    return new Promise(function (res) {
      var go = h('button', { class: 'guide-go', type: 'button', text: B.S.guides.go });
      var card = h('div', { class: 'guide-card' },
        h('h2', { text: g.title }),
        h('ol', { class: 'guide-steps' }, g.steps.map(function (t, i) { return h('li', {}, h('b', { text: UI.num(i + 1) }), h('span', { text: t })); })),
        go);
      var layer = h('div', { class: 'guide-layer' }, card);
      ctx.root.appendChild(layer);
      UI.anim(card, [{ opacity: 0, transform: 'translateY(20px) scale(.95)' }, { opacity: 1, transform: 'none' }], { dur: 400, easing: UI.SPRING, fill: 'none' });
      go.addEventListener('click', function () {
        if (B.audio) B.audio.play('tap');
