<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>روضة الدروس</title>
<style>
:root{--bg:#f3f6f8;--fg:#1d2b36;--muted:#5b6b78;--acc:#2a9d8f;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121a20;--fg:#e8eef2;--muted:#9fb0bc;--card:#1b252d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:16px}
.box{background:var(--card);border-radius:24px;padding:32px 28px;max-width:460px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.logo{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.logo i{width:16px;height:56px;border-radius:9px;display:block}
h1{margin:0 0 6px;font-size:1.8rem}
p{margin:6px 0;color:var(--muted);line-height:1.7}
.spin{width:34px;height:34px;border:4px solid rgba(42,157,143,.25);border-top-color:var(--acc);border-radius:50%;margin:18px auto;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a.btn{display:inline-block;margin:6px;padding:12px 18px;border-radius:14px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700}
a.btn.alt{background:transparent;color:var(--acc);border:2px solid var(--acc)}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><i style="background:#3a86ff"></i><i style="background:#e9c46a"></i><i style="background:#f4a261"></i><i style="background:#e76f51"></i></div>
  <h1>روضة الدروس</h1>
  <p id="msg">جارٍ فتح أحدث نسخة من البرنامج…</p>
  <div class="spin" id="spin"></div>
  <div id="btns" hidden>
    <a class="btn" href="https://aboyehia15-droid.github.io/rawda/">النسخة المحدَّثة (إنترنت)</a>
    <a class="btn alt" href="index.html">النسخة المحفوظة على الفلاشة</a>
  </div>
</div>
<script>
/* With internet: open the always-updated online version. Without internet: open the copy saved next to this file. */
(function(){
  var ONLINE="https://aboyehia15-droid.github.io/rawda/";
  var done=false;
  function go(url,text){if(done)return;done=true;document.getElementById("msg").textContent=text;location.replace(url)}
  function local(){go("index.html","لا يوجد اتصال بالإنترنت، يُفتح البرنامج من الفلاشة…")}
  var img=new Image();
  img.onload=function(){go(ONLINE,"جارٍ فتح أحدث نسخة من البرنامج…")};
  img.onerror=local;
  img.src=ONLINE+"icon-v3-192.png?t="+Date.now();
  setTimeout(function(){if(!done){local()}},6000);
  setTimeout(function(){document.getElementById("spin").hidden=true;document.getElementById("btns").hidden=false},9000);
})();
</script>
</body>
</html>
